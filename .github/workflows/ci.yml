name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  pty:
    name: interactive prompt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A pty that never releases its handle hangs rather than failing, so cap it.
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # One Node version rather than the whole matrix, because node-pty needs a
      # native build. Every OS, because ConPTY and the unix pty differ and the
      # prompt is the only thing exercising raw-mode keypress handling.
      - run: npm ci
      # node-pty ships darwin prebuilds whose spawn-helper is mode 644, because
      # npm tarballs do not preserve the executable bit. That surfaces as
      # posix_spawnp failing on every spawn rather than as an install error.
      # Linux builds from source and puts it under build/Release instead.
      - name: Ensure node-pty spawn-helper is executable
        if: runner.os != 'Windows'
        run: |
          chmod +x node_modules/node-pty/prebuilds/*/spawn-helper 2>/dev/null || true
          chmod +x node_modules/node-pty/build/Release/spawn-helper 2>/dev/null || true
          ls -l node_modules/node-pty/prebuilds/*/spawn-helper 2>/dev/null || true
      - run: npm run test:pty

  package:
    name: shipped artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Every skill declares a name matching its directory, and a description
        run: |
          # Deliberately line-based, not a YAML parse. The frontmatter block is
          # YAML-shaped but the agents that consume it parse it leniently: a
          # skill shipping today with an unquoted colon in its description loads
          # fine in Claude Code. Validating it strictly would fail files that work.
          fail=0
          for dir in skills/*/; do
            name=$(basename "$dir")
            file="$dir/SKILL.md"
            if [ ! -f "$file" ]; then
              echo "::error::$name has no SKILL.md"; fail=1; continue
            fi
            head -1 "$file" | grep -qx -- '---' \
              || { echo "::error::$file does not open with a frontmatter delimiter"; fail=1; }
            declared=$(awk -F': ' '/^name: /{print $2; exit}' "$file")
            [ "$declared" = "$name" ] \
              || { echo "::error::$file declares name '$declared' but lives in '$name'"; fail=1; }
            desc=$(awk '/^description: /{sub(/^description: /,""); print; exit}' "$file")
            [ -n "$desc" ] \
              || { echo "::error::$file has no description; every target routes on it"; fail=1; }
          done
          exit $fail

      # The payload reaching the tarball is the silent failure mode: an omitted
      # files entry installs nothing while appearing to succeed.
      - name: Payload is in the packed tarball
        run: |
          npm pack --silent >/dev/null
          tar tzf ./*.tgz > packed.txt
          for dir in skills/*/; do
            name=$(basename "$dir")
            grep -q "package/skills/$name/SKILL.md" packed.txt \
              || { echo "::error::$name missing from the tarball"; exit 1; }
          done
          grep -q 'package/bin/necklace.js' packed.txt || { echo "::error::bin missing"; exit 1; }
          ! grep -q 'package/test/' packed.txt || { echo "::error::tests should not ship"; exit 1; }

      # Install the packed artifact the way a user would and run it, so the
      # distribution path is covered rather than assumed.
      - name: Installing the tarball produces a working necklace init
        run: |
          npm i -g ./*.tgz
          repo=$(mktemp -d)
          cd "$repo"
          necklace init --agent claude --skip-beads-check
          for dir in $GITHUB_WORKSPACE/skills/*/; do
            name=$(basename "$dir")
            test -f ".claude/skills/$name/SKILL.md" \
              || { echo "::error::$name did not install"; exit 1; }
          done
          echo "installed $(ls .claude/skills | wc -l) skills from the tarball"
