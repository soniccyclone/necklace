<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="necklace">
  <defs>
    <radialGradient id="p" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f3ebff"/>
      <stop offset="55%" stop-color="#c9a9f0"/>
      <stop offset="100%" stop-color="#8b5cd6"/>
    </radialGradient>
    <radialGradient id="pc" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="50%" stop-color="#d3b6f5"/>
      <stop offset="100%" stop-color="#7c3fce"/>
    </radialGradient>
  </defs>

  <!-- cord: a shallow catenary the beads sit on -->
  <path d="M8 20 Q32 52 56 20" fill="none" stroke="#6d3fb0" stroke-width="2.5"
        stroke-linecap="round" opacity="0.85"/>

  <!-- five beads, centre largest, sitting on the cord -->
  <circle cx="11.5" cy="24.5" r="4.5" fill="url(#p)"/>
  <circle cx="21"   cy="35"   r="5.5" fill="url(#p)"/>
  <circle cx="32"   cy="39.5" r="8"   fill="url(#pc)"/>
  <circle cx="43"   cy="35"   r="5.5" fill="url(#p)"/>
  <circle cx="52.5" cy="24.5" r="4.5" fill="url(#p)"/>
</svg>
